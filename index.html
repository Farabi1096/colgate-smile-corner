<!DOCTYPE html>
<html lang="bn">
<head>




<!-- COLGATE CLINICAL BALANCED UI SYSTEM -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style id="deepCraftedUiSystem">
  :root {
    --colgate-crimson: #c82333;
    --colgate-crimson-dark: #a61b29;
    --clinical-blue: #0284c7;
    --clinical-ice: #f0f7ff;
    --clinical-border: #bae6fd;
    --app-canvas: #f1f5f9;
    --card-surface: #ffffff;
    --input-surface: #f8fafc;
    --slate-900: #0f172a;
    --hairline: #e2e8f0;
  }

  html, body {
    font-family: 'Inter', 'Hind Siliguri', sans-serif !important;
    background-color: var(--app-canvas) !important;
    color: var(--slate-900) !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow-x: hidden !important;
  }

  /* Flatten bulky curved mobile header/footer bars */
  header,
  header > div,
  .sticky.top-0,
  .fixed.top-0,
  .fixed.bottom-0,
  .sticky.bottom-0,
  [class*="rounded-b-"],
  [class*="rounded-t-"] {
    border-radius: 0px !important;
  }

  /* Crisp 10px card corners instead of huge bubble corners */
  .rounded-3xl, .rounded-2xl, .rounded-xl {
    border-radius: 10px !important;
  }

  .rounded-full:not(img):not(svg):not(.w-2):not(.w-2\.5):not(.w-3):not(.w-4):not(.w-5):not(.w-6):not(.w-7):not(.w-8) {
    border-radius: 8px !important;
  }

  button, input, select, textarea, .rounded-lg, .rounded-md {
    border-radius: 8px !important;
  }

  @media (max-width: 640px) {
    .max-w-md, .max-w-lg, #appContainer, main {
      max-width: 100% !important;
      width: 100% !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      border-radius: 0px !important;
    }
  }

  /* Header & Primary Buttons — Tuned Colgate Crimson */
  header {
    background: linear-gradient(135deg, var(--colgate-crimson) 0%, var(--colgate-crimson-dark) 100%) !important;
    color: #ffffff !important;
    box-shadow: 0 2px 10px rgba(166, 27, 41, 0.15) !important;
  }

  .bg-red-600, .bg-red-700, .bg-red-500,
  button[type="submit"], #submitBtn {
    background: var(--colgate-crimson) !important;
    border-color: var(--colgate-crimson) !important;
    color: #ffffff !important;
  }

  /* Balance Red Tint Boxes with Calm Clinical Sky-Ice */
  .bg-red-50, .bg-red-100 {
    background-color: var(--clinical-ice) !important;
    border-color: var(--clinical-border) !important;
  }

  span.bg-red-50, span.bg-red-100, div.bg-red-50.w-8, div.bg-red-100.w-8 {
    background-color: var(--clinical-ice) !important;
    color: var(--clinical-blue) !important;
    font-weight: 700 !important;
  }

  .text-red-600, .text-red-700, .text-red-500 {
    color: var(--colgate-crimson) !important;
  }

  .border-red-500, .border-red-600, .border-red-400, .border-red-300, .border-red-200, .border-red-100 {
    border-color: var(--hairline) !important;
  }

  input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
  select, textarea {
    background-color: var(--input-surface) !important;
    border: 1px solid #cbd5e1 !important;
    border-radius: 8px !important;
  }
  input:focus, select:focus, textarea:focus {
    background-color: #ffffff !important;
    border-color: var(--clinical-blue) !important;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.14) !important;
    outline: none !important;
  }

  [class*="border-dashed"] {
    border: 1.5px dashed #94a3b8 !important;
    background: linear-gradient(180deg, #f8fafc 0%, var(--clinical-ice) 100%) !important;
    border-radius: 8px !important;
  }

  /* Top-Center Smooth Notification Card */
  @keyframes noticeDropIn {
    0%   { opacity: 0; transform: translate(-50%, -16px) scale(0.98); }
    100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
  }
  #minimalTopNoticePill {
    position: fixed !important;
    top: 12px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    z-index: 999999 !important;
    width: calc(100% - 24px) !important;
    max-width: 375px !important;
    background: #141923 !important;
    color: #f8fafc !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-left: 4px solid var(--colgate-crimson) !important;
    border-radius: 10px !important;
    padding: 15px 16px 14px 16px !important;
    box-shadow: 0 16px 32px rgba(15, 23, 42, 0.38) !important;
    animation: noticeDropIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) !important;
  }
</style>

<!-- SAFE SUPABASE SETTINGS LISTENER (NO REGEX DELETION) -->
<script>
(function() {
  const SUPABASE_URL = "https://vzwplpljvgqalgfuxmsf.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6d3BscGxqdmdxYWxnZnV4bXNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNzI0MjAsImV4cCI6MjA5MTY0ODQyMH0.c24-s1502h523-7zB63u2N63W_s5I7tH3_R-bI7c3u4";
  const REST_URL = SUPABASE_URL + "/rest/v1/settings";
  let dismissedForCurrentLoad = false;

  function applyFieldSettings(s) {
    // 1. Gallery Unlock Control (Original 'গ্যালারি থেকে আপলোড' button only)
    const isUnlocked = String(s.gallery_access).toLowerCase() === 'unlocked' || String(s.gallery_unlocked) === 'true';
    localStorage.setItem('app_gallery', isUnlocked ? 'true' : 'false');

    const extraBar = document.getElementById('liveGalleryUploadTriggers');
    if (extraBar) extraBar.remove();

    document.querySelectorAll('button, label, a, div, span').forEach(el => {
      const txt = (el.textContent || '').trim();
      if (txt === 'গ্যালারি থেকে আপলোড' && el.children.length <= 2) {
        const targetBtn = el.closest('button, label, a') || el;
        targetBtn.style.display = isUnlocked ? '' : 'none';
      }
    });

    // 2. Top Minimal Notice Card
    const rawText = String(s.notice_text || s.global_notice || '').replace(/^"+|"+$/g, '').trim();
    const isActive = (String(s.notice_active) === 'true' || rawText.length > 0) && rawText.length > 0;

    let pill = document.getElementById('minimalTopNoticePill');
    if (!isActive || dismissedForCurrentLoad) {
      if (pill) pill.style.display = 'none';
      return;
    }

    if (!pill) {
      pill = document.createElement('div');
      pill.id = 'minimalTopNoticePill';
      document.body.appendChild(pill);
    }

    pill.style.display = 'block';
    pill.innerHTML = `
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;">জরুরী নোটিশ • Notice</div>
          <div style="font-size:14.5px;font-weight:600;color:#ffffff;line-height:1.45;word-break:break-word;">${rawText}</div>
        </div>
        <button id="closeMinimalNoticeX" title="Close" style="background:transparent;border:none;color:#94a3b8;font-size:18px;line-height:1;padding:2px 4px;cursor:pointer;">&times;</button>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
        <button id="okMinimalNoticeBtn" style="background:#c82333;border:none;color:#ffffff;font-size:12px;font-weight:600;padding:6px 16px;border-radius:6px;cursor:pointer;">ঠিক আছে (Okay)</button>
      </div>
    `;

    const dismissHandler = function() {
      dismissedForCurrentLoad = true;
      pill.style.display = 'none';
    };
    document.getElementById('closeMinimalNoticeX').onclick = dismissHandler;
    document.getElementById('okMinimalNoticeBtn').onclick = dismissHandler;
  }

  async function syncFromSupabase() {
    try {
      const res = await fetch(REST_URL + "?select=key,value", {
        headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
      });
      const rows = await res.json();
      if (Array.isArray(rows)) {
        const s = {};
        rows.forEach(r => { if (r.key) s[r.key] = r.value; });
        applyFieldSettings(s);
      }
    } catch (e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', syncFromSupabase);
  } else {
    syncFromSupabase();
  }
  setInterval(syncFromSupabase, 8000);
})();
</script>

</body>
</html>
