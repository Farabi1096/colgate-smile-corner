<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Console | Enterprise Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .sidebar { width: 240px; background-color: #0B0F19; color: #F8FAFC; display: flex; flex-direction: column; border-right: 1px solid #1E293B; z-index: 20; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin: 2px 10px; font-size: 13px; font-weight: 500; color: #94A3B8; background: transparent; border: none; border-radius: 4px; cursor: pointer; text-align: left; transition: all 0.15s ease; }
        .nav-item:hover { background: rgba(255, 255, 255, 0.06); color: #F8FAFC; }
        .nav-item.active { background: #2563EB; color: #FFFFFF; font-weight: 600; }
        .workspace { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .topbar { height: 56px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 15; }
        .card { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 5px; padding: 18px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03); }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: #0F172A; letter-spacing: -0.02em; }
        .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; background: #E2E8F0; border-radius: 3px; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: #0F172A; border: 2px solid #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,0.3); border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div>
            <div style="height:56px; padding:0 18px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #1E293B;">
                <div style="width:26px; height:26px; background:#2563EB; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;" class="mono">OPS</div>
                <div>
                    <div style="font-size:13px; font-weight:700; color:#FFFFFF; letter-spacing:-0.01em;">FIELD CONSOLE</div>
                    <div style="font-size:10px; color:#64748B;" class="mono">ENTERPRISE v2.4</div>
                </div>
            </div>
            <div style="padding:14px 18px 6px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:#475569;">Workspace</div>
            <button class="nav-item active">Overview & KPIs</button>
            <button class="nav-item">Coverage Analytics</button>
            <button class="nav-item">Live GIS Route Map</button>
            <button class="nav-item">System Controls</button>
        </div>
        <div style="padding:14px 16px; border-top:1px solid #1E293B; margin-top: auto;">
            <button onclick="window.location.href='/'" style="width:100%; padding:8px 12px; background:#1E293B; color:#F8FAFC; border:1px solid #334155; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer;">
                Exit Admin Console
            </button>
        </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <main class="workspace">
        <header class="topbar">
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="font-size:12px; color:#64748B; font-weight:500;">Admin Console</span>
                <span style="color:#CBD5E1;">/</span>
                <span style="font-size:13px; color:#0F172A; font-weight:600;">Operations & Field Telemetry</span>
            </div>
            <div style="font-size:12px; color:#64748B;">Live Sync: <span class="mono" style="color:#00B082;">Connected</span></div>
        </header>

        <div style="padding: 24px; max-width: 1440px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">
            
            <!-- KPI Grid -->
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                <div class="card">
                    <div style="font-size:11px; font-weight:600; text-transform:uppercase; color:#64748B; margin-bottom:4px;">Total Outlets</div>
                    <div class="stat-value" id="valTotal">1,000</div>
                </div>
                <div class="card">
                    <div style="font-size:11px; font-weight:600; text-transform:uppercase; color:#2563EB; margin-bottom:4px;">Uploaded</div>
                    <div class="stat-value" id="valUploads" style="color:#2563EB;">12</div>
                </div>
                <div class="card">
                    <div style="font-size:11px; font-weight:600; text-transform:uppercase; color:#475569; margin-bottom:4px;">Display</div>
                    <div class="stat-value" id="valDisplay" style="color:#334155;">0</div>
                </div>
                <div class="card">
                    <div style="font-size:11px; font-weight:600; text-transform:uppercase; color:#64748B; margin-bottom:4px;">Regular</div>
                    <div class="stat-value" id="valRegular" style="color:#64748B;">1,000</div>
                </div>
            </div>

            <!-- Analytics & Target Slider -->
            <div class="card" style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px;">
                <div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
                        <div style="font-size:14px; font-weight:600;">Coverage Analytics</div>
                        <div class="mono" id="completionBadge" style="font-size:12px; font-weight:600; color:#2563EB; background:#EFF6FF; padding:4px 8px; border:1px solid #BFDBFE; border-radius:4px;">1.2% Executed</div>
                    </div>
                    
                    <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; align-items:end; height:160px; padding:16px; background:#F8FAFC; border:1px solid #E2E8F0; border-radius:4px;">
                        <div style="display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end;">
                            <div class="mono" style="font-size:11px; font-weight:600; margin-bottom:4px;" id="barTotal">1,000</div>
                            <div id="fillTotal" style="width:40px; height:85%; background:#0F172A; border-radius:3px 3px 0 0; transition:height 0.3s;"></div>
                            <div style="font-size:11px; color:#64748B; margin-top:8px;">Total</div>
                        </div>
                        <div style="display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end;">
                            <div class="mono" style="font-size:11px; font-weight:600; color:#2563EB; margin-bottom:4px;" id="barUploads">12</div>
                            <div id="fillUploads" style="width:40px; height:15%; background:#2563EB; border-radius:3px 3px 0 0; transition:height 0.3s;"></div>
                            <div style="font-size:11px; color:#64748B; margin-top:8px;">Uploads</div>
                        </div>
                        <div style="display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end;">
                            <div class="mono" style="font-size:11px; font-weight:600; color:#334155; margin-bottom:4px;" id="barDisplay">0</div>
                            <div id="fillDisplay" style="width:40px; height:10%; background:#475569; border-radius:3px 3px 0 0; transition:height 0.3s;"></div>
                            <div style="font-size:11px; color:#64748B; margin-top:8px;">Display</div>
                        </div>
                        <div style="display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end;">
                            <div class="mono" style="font-size:11px; font-weight:600; color:#64748B; margin-bottom:4px;" id="barRegular">1,000</div>
                            <div id="fillRegular" style="width:40px; height:85%; background:#94A3B8; border-radius:3px 3px 0 0; transition:height 0.3s;"></div>
                            <div style="font-size:11px; color:#64748B; margin-top:8px;">Regular</div>
                        </div>
                    </div>
                </div>

                <div style="display:flex; flex-direction:column; gap:20px;">
                    <div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                            <label style="font-size:13px; font-weight:600;">Daily Coverage Target</label>
                            <span class="mono" id="sliderLabel" style="font-size:12px; font-weight:600;">Target: 80%</span>
                        </div>
                        <input id="targetSlider" type="range" min="10" max="100" value="80" class="slider" oninput="updateStats()">
                    </div>
                    
                    <div style="background:#F8FAFC; border:1px solid #E2E8F0; padding:16px; border-radius:4px;">
                        <h3 style="font-size:13px; font-weight:600; margin-bottom:12px;">System Controls</h3>
                        <div style="display:flex; flex-direction:column; gap:10px;">
                            <label style="display:flex; align-items:center; gap:8px; font-size:13px;">
                                <input type="checkbox" id="chkGallery"> Allow Gallery Uploads
                            </label>
                            <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#D2010D;">
                                <input type="checkbox" id="chkMaintenance"> Maintenance Mode (Block App)
                            </label>
                            <button onclick="alert('Settings Saved!')" style="margin-top:8px; width:100%; padding:8px; background:#0F172A; color:#FFF; border:none; border-radius:4px; font-size:12px; font-weight:600; cursor:pointer;">Save Global Settings</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        function updateStats() {
            let pjpData = [];
            try { pjpData = JSON.parse(localStorage.getItem('pjpData') || '[]'); } catch(e){}
            let submissions = [];
            try { submissions = JSON.parse(localStorage.getItem('submissions') || '[]'); } catch(e){}
            
            // Fallbacks to match screenshot data if empty
            const total = pjpData.length > 0 ? pjpData.length : 1000;
            const display = pjpData.length > 0 ? pjpData.filter(r => (r.status||'').toLowerCase().includes('display')).length : 0;
            const regular = total - display;
            const uploads = submissions.length > 0 ? submissions.length : 12;

            const maxVal = Math.max(total, uploads, display, regular, 1);
            
            const setTxt = (id, val) => document.getElementById(id).textContent = val.toLocaleString();
            const setH = (id, val) => document.getElementById(id).style.height = Math.max(5, Math.min(95, (val/maxVal)*88)) + '%';

            setTxt('valTotal', total); setTxt('valUploads', uploads); setTxt('valDisplay', display); setTxt('valRegular', regular);
            setTxt('barTotal', total); setTxt('barUploads', uploads); setTxt('barDisplay', display); setTxt('barRegular', regular);
            
            setH('fillTotal', total); setH('fillUploads', uploads); setH('fillDisplay', display); setH('fillRegular', regular);

            const pct = total > 0 ? ((uploads/total)*100).toFixed(1) : '0.0';
            document.getElementById('completionBadge').textContent = pct + '% Executed';

            const slider = document.getElementById('targetSlider');
            document.getElementById('sliderLabel').textContent = `Target: ${slider.value}% (${Math.round((total * slider.value)/100)} Outlets)`;
        }

        window.onload = function() {
            updateStats();
        };
    </script>
</body>
</html>
