<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Console | Enterprise Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B0F19; overflow: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; background: #333D47; border-radius: 3px; outline: none; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: #007AC2; border: 2px solid #FFFFFF; border-radius: 3px; cursor: pointer; }
        
        /* Custom Scrollbar for Dark Slate */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121820; }
        ::-webkit-scrollbar-thumb { background: #333D47; border-radius: 3px; }
    </style>
</head>
<body class="text-[#E2E8F0] bg-[#121820]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [pin, setPin] = useState("");
            const [loggedIn, setLoggedIn] = useState(false);
            const [targetVal, setTargetVal] = useState(80);
            const [stats, setStats] = useState({ total: 1000, uploads: 12, display: 0, regular: 1000 });

            if (!loggedIn) {
                return (
                    <div className="h-screen w-screen flex items-center justify-center bg-[#0B0F19]">
                        <div className="bg-[#1E252D] border border-[#333D47] p-8 rounded-md shadow-2xl w-full max-w-sm">
                            <div className="flex items-center gap-3 mb-6">
                                <div className="w-8 h-8 bg-[#007AC2] text-white flex items-center justify-center font-bold text-xs mono rounded-sm">OPS</div>
                                <div>
                                    <h1 className="text-white font-bold tracking-tight">FIELD CONSOLE</h1>
                                    <p className="text-[#5D8AA8] text-xs mono">ENTERPRISE LOGIN</p>
                                </div>
                            </div>
                            <input 
                                type="password" value={pin} onChange={(e) => setPin(e.target.value)} 
                                placeholder="Enter PIN..." maxLength={4}
                                className="w-full bg-[#121820] border border-[#333D47] text-white rounded p-3 mb-4 text-center text-xl tracking-[0.5em] focus:outline-none focus:border-[#007AC2]"
                            />
                            <button 
                                onClick={() => pin === "1234" ? setLoggedIn(true) : alert("Invalid PIN")}
                                className="w-full bg-[#007AC2] hover:bg-[#005f99] text-white font-semibold py-3 rounded-md transition-colors"
                            >
                                Authenticate
                            </button>
                        </div>
                    </div>
                );
            }

            const maxVal = Math.max(stats.total, stats.uploads, stats.display, stats.regular, 1);
            const getH = (val) => Math.max(5, Math.min(95, (val/maxVal)*88)) + '%';

            return (
                <div className="flex h-screen w-screen overflow-hidden bg-[#121820]">
                    
                    {/* SIDEBAR */}
                    <aside className="w-[240px] bg-[#0B0F19] flex flex-col border-r border-[#333D47] z-20 shrink-0">
                        <div className="h-14 px-4 flex items-center gap-3 border-b border-[#333D47]">
                            <div className="w-6 h-6 bg-[#007AC2] text-white flex items-center justify-center font-bold text-[11px] mono">OPS</div>
                            <div>
                                <div className="text-[13px] font-bold tracking-tight text-[#FFFFFF]">FIELD CONSOLE</div>
                                <div className="text-[10px] text-[#5D8AA8] mono">ENTERPRISE v2.4</div>
                            </div>
                        </div>
                        <div className="px-4 pt-4 pb-2 text-[10px] font-bold uppercase tracking-wider text-[#939598]">Workspace</div>
                        <button className="flex items-center gap-2 mx-2 px-3 py-2 text-[13px] font-semibold bg-[#007AC2] text-white rounded-sm text-left">Overview & KPIs</button>
                        <button className="flex items-center gap-2 mx-2 px-3 py-2 text-[13px] font-medium text-[#939598] hover:text-white hover:bg-white/5 rounded-sm text-left transition-colors">Coverage Analytics</button>
                        <button className="flex items-center gap-2 mx-2 px-3 py-2 text-[13px] font-medium text-[#939598] hover:text-white hover:bg-white/5 rounded-sm text-left transition-colors">Live GIS Route Map</button>
                        <button className="flex items-center gap-2 mx-2 px-3 py-2 text-[13px] font-medium text-[#939598] hover:text-white hover:bg-white/5 rounded-sm text-left transition-colors">System Controls</button>
                        
                        <div className="mt-auto p-4 border-t border-[#333D47]">
                            <button onClick={() => setLoggedIn(false)} className="w-full py-2 bg-[#1E252D] hover:bg-[#333D47] text-[#FFFFFF] text-xs font-semibold rounded-sm border border-[#333D47] transition-colors">
                                Exit Console
                            </button>
                        </div>
                    </aside>

                    {/* MAIN WORKSPACE */}
                    <main className="flex-1 flex flex-col overflow-y-auto">
                        <header className="h-14 bg-[#1E252D] border-b border-[#333D47] px-6 flex items-center justify-between sticky top-0 z-10 shrink-0">
                            <div className="flex items-center gap-2">
                                <span className="text-xs text-[#939598] font-medium">Admin Console</span>
                                <span className="text-[#333D47]">/</span>
                                <span className="text-[13px] text-[#FFFFFF] font-semibold">Operations & Field Telemetry</span>
                            </div>
                            <div className="text-xs text-[#939598] font-medium flex items-center gap-2">
                                Live Sync: <span className="mono text-[#00B082] font-bold">Connected</span>
                                <div className="w-2 h-2 rounded-full bg-[#00B082] animate-pulse"></div>
                            </div>
                        </header>

                        <div className="p-6 max-w-[1440px] w-full mx-auto flex flex-col gap-5">
                            
                            {/* KPI GRID */}
                            <div className="grid grid-cols-4 gap-4">
                                <div className="bg-[#1E252D] border border-[#333D47] rounded-md p-4">
                                    <div className="text-[11px] font-semibold uppercase text-[#939598] mb-1">Total Outlets</div>
                                    <div className="mono text-2xl font-bold text-[#FFFFFF] tracking-tight">{stats.total.toLocaleString()}</div>
                                </div>
                                <div className="bg-[#1E252D] border border-[#007AC2] rounded-md p-4">
                                    <div className="text-[11px] font-semibold uppercase text-[#007AC2] mb-1">Uploaded</div>
                                    <div className="mono text-2xl font-bold text-[#FFFFFF] tracking-tight">{stats.uploads.toLocaleString()}</div>
                                </div>
                                <div className="bg-[#1E252D] border border-[#333D47] rounded-md p-4">
                                    <div className="text-[11px] font-semibold uppercase text-[#939598] mb-1">Display</div>
                                    <div className="mono text-2xl font-bold text-[#FFFFFF] tracking-tight">{stats.display.toLocaleString()}</div>
                                </div>
                                <div className="bg-[#1E252D] border border-[#333D47] rounded-md p-4">
                                    <div className="text-[11px] font-semibold uppercase text-[#939598] mb-1">Regular</div>
                                    <div className="mono text-2xl font-bold text-[#FFFFFF] tracking-tight">{stats.regular.toLocaleString()}</div>
                                </div>
                            </div>

                            {/* CHARTS & CONTROLS */}
                            <div className="grid grid-cols-[1.5fr_1fr] gap-6 bg-[#1E252D] border border-[#333D47] rounded-md p-6">
                                
                                {/* Chart */}
                                <div>
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-sm font-semibold text-[#FFFFFF]">Coverage Analytics</h2>
                                        <div className="mono text-xs font-semibold text-[#00B082] border border-[#00B082] px-2 py-1 rounded-sm bg-[#00B082]/10">
                                            {stats.total > 0 ? ((stats.uploads/stats.total)*100).toFixed(1) : '0.0'}% Executed
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-4 gap-4 h-40 border border-[#333D47] rounded-md p-4 items-end bg-[#0B0F19]">
                                        <div className="flex flex-col items-center justify-end h-full">
                                            <span className="mono text-[11px] font-semibold text-[#FFFFFF] mb-1">{stats.total}</span>
                                            <div className="w-10 bg-[#333D47] rounded-t-sm transition-all duration-300" style={{height: getH(stats.total)}}></div>
                                            <span className="text-[11px] text-[#939598] mt-2 font-medium">Total</span>
                                        </div>
                                        <div className="flex flex-col items-center justify-end h-full">
                                            <span className="mono text-[11px] font-semibold text-[#007AC2] mb-1">{stats.uploads}</span>
                                            <div className="w-10 bg-[#007AC2] rounded-t-sm transition-all duration-300" style={{height: getH(stats.uploads)}}></div>
                                            <span className="text-[11px] text-[#939598] mt-2 font-medium">Uploads</span>
                                        </div>
                                        <div className="flex flex-col items-center justify-end h-full">
                                            <span className="mono text-[11px] font-semibold text-[#FFFFFF] mb-1">{stats.display}</span>
                                            <div className="w-10 bg-[#5D8AA8] rounded-t-sm transition-all duration-300" style={{height: getH(stats.display)}}></div>
                                            <span className="text-[11px] text-[#939598] mt-2 font-medium">Display</span>
                                        </div>
                                        <div className="flex flex-col items-center justify-end h-full">
                                            <span className="mono text-[11px] font-semibold text-[#FFFFFF] mb-1">{stats.regular}</span>
                                            <div className="w-10 bg-[#333D47] rounded-t-sm transition-all duration-300" style={{height: getH(stats.regular)}}></div>
                                            <span className="text-[11px] text-[#939598] mt-2 font-medium">Regular</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Controls */}
                                <div className="flex flex-col gap-5">
                                    <div>
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-[13px] font-semibold text-[#FFFFFF]">Daily Coverage Target</label>
                                            <span className="mono text-xs font-semibold text-[#007AC2]">
                                                Target: {targetVal}% ({Math.round((stats.total * targetVal)/100)})
                                            </span>
                                        </div>
                                        <input 
                                            type="range" min="10" max="100" value={targetVal} 
                                            onChange={(e) => setTargetVal(e.target.value)} 
                                            className="slider"
                                        />
                                    </div>

                                    <div className="border border-[#333D47] p-4 rounded-md bg-[#0B0F19]">
                                        <h3 className="text-[13px] font-semibold text-[#FFFFFF] mb-3">System Controls</h3>
                                        <div className="flex flex-col gap-2.5">
                                            <label className="flex items-center gap-2 text-[13px] font-medium text-[#E2E8F0] cursor-pointer hover:text-[#FFFFFF]">
                                                <input type="checkbox" className="rounded bg-[#121820] border-[#333D47] text-[#007AC2] focus:ring-0" /> 
                                                Allow Gallery Uploads
                                            </label>
                                            <label className="flex items-center gap-2 text-[13px] font-medium text-[#D2010D] cursor-pointer">
                                                <input type="checkbox" className="rounded bg-[#121820] border-[#333D47] text-[#D2010D] focus:ring-0" /> 
                                                Maintenance Mode (Block App)
                                            </label>
                                            <button 
                                                onClick={() => alert('Settings Saved to Database')} 
                                                className="mt-2 w-full py-2 bg-[#1E252D] hover:bg-[#333D47] text-[#FFFFFF] text-xs font-semibold rounded-sm transition-colors border border-[#333D47]"
                                            >
                                                Save Global Settings
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
